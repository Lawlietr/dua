# upload-darwin — one-off pipeline to attach a darwin/arm64 tarball to an
# existing GitHub Release (v0.2.0). Cross-compiles on Linux, smoke-tests the
# result on a real Apple Silicon runner, then uploads behind an explicit
# confirmation guard. Safe to delete once the next regular release ships
# darwin targets from the main release workflow.
name: upload-darwin

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build from'
        required: false
        default: 'main'
      version:
        description: 'Version string embedded in the binaries'
        required: false
        default: 'v0.2.0'
      confirm_tag:
        description: 'Type exactly "v0.2.0" to enable release upload; leave empty for a dry run'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: cross-compile darwin/arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build binaries
        env:
          GOOS: darwin
          GOARCH: arm64
          CGO_ENABLED: "0"
          VERSION: ${{ inputs.version || 'v0.2.0' }}
          COMMIT: ${{ github.sha }}
        run: |
          mkdir -p bin
          go build -trimpath -ldflags="-s -w -X 'main.version=$VERSION' -X 'main.commit=$COMMIT'" -o bin/dua-analyze ./cmd/analyze
          go build -trimpath -ldflags="-s -w -X 'main.version=$VERSION' -X 'main.commit=$COMMIT'" -o bin/dua-status ./cmd/status
      - name: Package tarball
        run: |
          mkdir -p stage dist
          cp dua stage/
          cp bin/dua-analyze bin/dua-status stage/
          tar -czf "dist/dua-darwin-arm64.tar.gz" -C stage dua dua-analyze dua-status
          (cd dist && sha256sum "dua-darwin-arm64.tar.gz" > "dua-darwin-arm64.tar.gz.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: dua-darwin-arm64
          path: |
            dist/dua-darwin-arm64.tar.gz
            dist/dua-darwin-arm64.tar.gz.sha256

  smoke:
    name: smoke on macos-14 (Apple Silicon)
    needs: build
    runs-on: macos-14
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dua-darwin-arm64
          path: dist
      - name: Verify checksum and extract
        run: |
          cd dist
          shasum -a 256 -c dua-darwin-arm64.tar.gz.sha256
          mkdir prefix && tar -xzf dua-darwin-arm64.tar.gz -C prefix
      - name: Router sanity
        run: bash -n dist/prefix/dua
      - name: Run binaries and validate JSON output
        run: |
          cd dist/prefix
          ./dua version
          ./dua version | grep -Eq '^dua version v'
          ./dua analyze --json "$RUNNER_TEMP" > analyze.json
          jq -e '.version' analyze.json > /dev/null
          ./dua status --json > status.json
          jq -e '.version' status.json > /dev/null
          echo "darwin/arm64 smoke OK"

  upload:
    name: attach assets to v0.2.0 release
    needs: smoke
    if: ${{ inputs.confirm_tag == 'v0.2.0' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dua-darwin-arm64
          path: dist
      - name: Replace darwin assets on the release (linux assets untouched)
        run: |
          gh release delete-asset v0.2.0 dua-darwin-arm64.tar.gz --repo Lawlietr/dua --yes || true
          gh release delete-asset v0.2.0 dua-darwin-arm64.tar.gz.sha256 --repo Lawlietr/dua --yes || true
          gh release upload v0.2.0 \
            dist/dua-darwin-arm64.tar.gz \
            dist/dua-darwin-arm64.tar.gz.sha256 \
            --repo Lawlietr/dua
      - name: Rebuild macOS section in release notes (replaces previous section)
        run: |
          gh api repos/Lawlietr/dua/releases/tags/v0.2.0 --jq .body > body.md
          awk '/^### macOS \(Apple Silicon\)/{exit} {print}' body.md > body.trimmed && mv body.trimmed body.md
          printf '%s\n' '### macOS (Apple Silicon) - experimental' \
            '' \
            'This release also ships `dua-darwin-arm64.tar.gz` as secondary support: cross-compiled by CI and smoke-tested on an Apple Silicon runner.' \
            '' \
            '- Install: `mkdir -p ~/.local/bin && curl -fsSL "https://github.com/Lawlietr/dua/releases/latest/download/dua-darwin-arm64.tar.gz" | tar -xz -C ~/.local/bin`' \
            '- Built from the v0.2.0 sources plus small darwin-specific fixes (platform-aware update tarball resolution, `open`-based file opener), so the COMMIT embedded in the darwin binaries differs from the Linux assets.' \
            '- Apple Silicon only; Intel Mac builds are not provided.' \
            >> body.md
          gh release edit v0.2.0 --notes-file body.md --repo Lawlietr/dua
