# golangci-lint configuration for dua
# https://golangci-lint.run/usage/configuration/

version: "2"

run:
  timeout: 5m
  # Only lint Go code in cmd directory
  modules-download-mode: readonly

linters:
  enable:
    # Default linters
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused
    # Additional linters
    - modernize
    - revive
    - unparam
    # Security scanner. dua scans user paths and shells out to du/xdg-open,
    # so gosec is high-value here even with some false positives.
    - gosec

  settings:
    govet:
      enable-all: true
      disable:
        - shadow
        - fieldalignment # struct field alignment optimization is noisy
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (*os/exec.Cmd).Run
        - (*os/exec.Cmd).Start
    revive:
      rules:
        - name: use-waitgroup-go
    staticcheck:
      checks: ["all", "-QF1003", "-SA9003"]
    gosec:
      # dua is a system tool: scanning user-supplied paths and shelling out
      # to du/xdg-open are core features, not vulnerabilities. We rely on
      # validatePath (covered by FuzzValidatePath) for path safety.
      excludes:
        - G104 # already covered by errcheck
        - G115 # integer overflow on stat.{Bavail,Bsize,Dev,Ino} and FileInfo.Size
        - G204 # subprocess with variable; required for du/xdg-open
        - G301 # mkdir perms; we use 0o755 intentionally
        - G302 # chmod perms; same
        - G304 # file inclusion via variable; we scan user paths by design
        - G306 # WriteFile perms; we use 0o644 intentionally
        - G702 # command injection taint; du takes user paths by design
        - G703 # path traversal taint; scanning user paths is dua's purpose

  exclusions:
    rules:
      # Ignore certain patterns in test files
      - path: _test\.go
        linters:
          - errcheck
          - gosec
          - unparam
